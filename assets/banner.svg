<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
      
      @keyframes float1 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.7; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }
      .floating-card-1 { animation: float1 6s ease-in-out infinite; transform-origin: center; }
      .floating-card-2 { animation: float2 8s ease-in-out infinite; transform-origin: center; }
      .glowing-orb { animation: pulse 4s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 10, 10; animation: dash 2s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>

  <!-- Ambient Glowing Orbs in Background (behind content) -->
  <circle cx="150" cy="100" r="180" fill="#6366f1" opacity="0.15" class="glowing-orb" filter="url(#glow)"/>
  <circle cx="1050" cy="300" r="200" fill="#a855f7" opacity="0.15" class="glowing-orb" filter="url(#glow)"/>
  <circle cx="900" cy="80" r="120" fill="#ec4899" opacity="0.12" class="glowing-orb" filter="url(#glow)"/>

  <!-- Geometric Grid Accent (Background layer) -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Animated Tech Illustration (Right Side Decorative Card) -->
  <g class="floating-card-1" transform="translate(820, 70)">
    <rect width="320" height="260" rx="16" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" backdrop-filter="blur(10px)"/>
    <rect x="20" y="20" width="280" height="40" rx="8" fill="#6366f1" opacity="0.2"/>
    <text x="35" y="45" font-family="system-ui" font-size="14" font-weight="bold" fill="#a5b4fc">🧠 Foundation Model Hub</text>
    
    <!-- Flow Nodes -->
    <circle cx="50" cy="100" r="12" fill="#6366f1"/>
    <circle cx="160" cy="100" r="12" fill="#a855f7"/>
    <circle cx="270" cy="100" r="12" fill="#ec4899"/>
    
    <line x1="62" y1="100" x2="148" y2="100" stroke="#a5b4fc" stroke-width="2" class="flow-line"/>
    <line x1="172" y1="100" x2="258" y2="100" stroke="#f0abfc" stroke-width="2" class="flow-line"/>

    <!-- Stat Bars -->
    <rect x="30" y="140" width="260" height="12" rx="6" fill="#ffffff" opacity="0.08"/>
    <rect x="30" y="140" width="180" height="12" rx="6" fill="url(#accent-grad)"/>

    <rect x="30" y="170" width="260" height="12" rx="6" fill="#ffffff" opacity="0.08"/>
    <rect x="30" y="170" width="220" height="12" rx="6" fill="url(#accent-grad)"/>

    <rect x="30" y="200" width="260" height="12" rx="6" fill="#ffffff" opacity="0.08"/>
    <rect x="30" y="200" width="140" height="12" rx="6" fill="url(#accent-grad)"/>
  </g>

  <g class="floating-card-2" transform="translate(740, 220)">
    <rect width="160" height="100" rx="12" fill="#1e1b4b" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="40" font-family="system-ui" font-size="13" font-weight="600" fill="#cbd5e1">⚡ vLLM / Ollama</text>
    <text x="20" y="70" font-family="system-ui" font-size="22" font-weight="bold" fill="#38bdf8">24x Speed</text>
  </g>

  <!-- Foreground Title and Subtitle Header (Always Above All Animations) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill -->
    <g transform="translate(0, 75)">
      <rect width="280" height="34" rx="17" fill="url(#accent-grad)" opacity="0.2"/>
      <rect width="280" height="34" rx="17" fill="none" stroke="#a855f7" stroke-width="1"/>
      <text x="17" y="22" class="badge-text">🚀 Awesome Generative AI Stack</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title">Generative AI Foundation</text>
    <text x="0" y="220" class="title" fill="url(#accent-grad)">Model Platform 🧠☁️</text>

    <!-- Subtitle -->
    <text x="0" y="270" class="subtitle">Curated Directory of Commercial LLM APIs &amp; Open-Source Serving Infrastructure</text>

    <!-- Badges Row in Banner -->
    <g transform="translate(0, 305)">
      <!-- Badge 1 -->
      <rect width="130" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="15" y="20" font-family="system-ui" font-size="12" font-weight="600" fill="#94a3b8">🏢 Commercial APIs</text>

      <!-- Badge 2 -->
      <rect x="142" y="0" width="145" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="157" y="20" font-family="system-ui" font-size="12" font-weight="600" fill="#94a3b8">🔓 Open Source LLMs</text>

      <!-- Badge 3 -->
      <rect x="299" y="0" width="145" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="314" y="20" font-family="system-ui" font-size="12" font-weight="600" fill="#94a3b8">⚡ vLLM &amp; Serving</text>
    </g>
  </g>
</svg>
